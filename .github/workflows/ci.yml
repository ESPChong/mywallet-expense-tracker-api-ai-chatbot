name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      # - name: "Warm MongoDB binary (cold-start download)"
      #   timeout-minutes: 10
      #   env:
      #     MONGOMS_DEBUG: "1"
      #   run: node apps/web-app/src/scripts/warm-mongo-cache.mjs
      - name: "A: baseline smoke (should hang ~90s)"
        working-directory: apps/web-app
        timeout-minutes: 4
        run: node src/scripts/prisma-push-smoke.mjs

      - name: "B: smoke with update-check disabled"
        working-directory: apps/web-app
        timeout-minutes: 4
        continue-on-error: true
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "1"
        run: node src/scripts/prisma-push-smoke.mjs

      - name: "C: prisma pinned to 6.12.0"
        timeout-minutes: 6
        continue-on-error: true
        run: |
          git checkout -- apps/web-app/prisma.config.ts || true
          npm i -D --save-exact prisma@6.12.0 -w apps/web-app
          cd apps/web-app && node src/scripts/prisma-push-smoke.mjs
      - name: "Prisma push smoke"
        working-directory: apps/web-app
        timeout-minutes: 3
        run: node src/scripts/prisma-push-smoke.mjs

      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:test
      - run: npm run web:build

    timeout-minutes: 20

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm run web:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-app/playwright-report/
          retention-days: 7
    timeout-minutes: 20

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (no push)
        run: docker build -f apps/web-app/Dockerfile -t expense-tracker:ci .
